services:
  # 前端服务
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_WALLET_ADAPTER_NETWORK: devnet
    depends_on:
      - api
    networks:
      - solon-network

  # 后端API服务
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://solon:solon_password@db:5432/solon_ai}
      REDIS_URL: redis://redis:6379
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      PYTHONPATH: /workspace/services:/workspace/services/ai-agents:/workspace/apps/api
    depends_on:
      - db
      - redis
    command: >
      sh -c "python -m app.core.init_db &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - solon-network

  # PostgreSQL数据库
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: solon
      POSTGRES_PASSWORD: solon_password
      POSTGRES_DB: solon_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - solon-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - solon-network

networks:
  solon-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

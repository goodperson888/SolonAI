name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  # ==========================================
  # 前端检查
  # ==========================================
  frontend-lint:
    name: 前端 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: cd apps/web && npm run lint

      - name: Prettier check
        run: cd apps/web && npm run format:check

      - name: TypeScript type check
        run: cd apps/web && npm run type-check

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: [frontend-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: cd apps/web && npm run build

  # ==========================================
  # 后端检查
  # ==========================================
  backend-lint:
    name: 后端 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Ruff check
        run: ruff check apps/api/ services/

      - name: Ruff format check
        run: ruff format --check apps/api/ services/

  # ==========================================
  # Commitlint 检查
  # ==========================================
  commitlint:
    name: Commit 信息检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

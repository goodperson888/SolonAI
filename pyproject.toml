[tool.ruff]
# Same line length as before
line-length = 100
target-version = "py39"

# Exclude directories
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), bugbear (B), and more
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

# Ignore specific rules that conflict with FastAPI patterns
ignore = [
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # Within except clause, raise from err (too verbose for API error handling)
    "E402",  # Module level import not at top of file (sometimes needed)
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

[tool.ruff.lint.isort]
# Use black-compatible import sorting
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 1

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
